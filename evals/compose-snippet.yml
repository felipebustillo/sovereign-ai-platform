# Append to the root docker-compose.yml when ready to run evals on cron / CI.
# Kept out of the main compose so this image isn't built / pulled on every
# deploy (it's only invoked on-demand via `docker compose run`).
#
# Build context is the repo root so the rag/ package is included in the image.
#   docker compose --profile eval run --rm rag-eval

  rag-eval:
    build:
      context: .
      dockerfile: evals/Dockerfile
    container_name: rag-eval
    profiles: ["eval"]   # only runs when --profile eval is passed
    restart: "no"
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_LLM_MODEL: qwen2.5:7b-instruct-q4_K_M
      OLLAMA_EMBED_MODEL: bge-m3
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      TEI_RERANKER_URL: http://tei-reranker:80
      RAG_COLLECTION: sovereign_docs
      LANGFUSE_HOST: http://langfuse:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      tei-reranker:
        condition: service_healthy
